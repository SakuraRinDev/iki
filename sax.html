<!DOCTYPE html>
<html lang="ja">
<head>

<title>IKI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
html,body{margin:0;height:100%;background:#1a1108;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#msg{position:fixed;top:16%;right:calc(env(safe-area-inset-right,0px) + 12px);writing-mode:vertical-rl;pointer-events:none;
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-weight:700;font-size:14px;line-height:2.1;letter-spacing:.28em;
  color:rgba(255,226,160,.62);text-shadow:0 -1px 0 rgba(0,0,0,.55);transition:opacity 1.2s ease}
#msg.off{opacity:0}
#msg small{display:block;font-weight:500;font-size:12px;letter-spacing:.24em;opacity:.8}
#hap{position:fixed;left:-200px;top:0;opacity:0;pointer-events:none}
#acc{position:fixed;transform:translate(0,-55%);pointer-events:none;font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-weight:700;
  font-size:22px;color:#fff1cf;text-shadow:0 0 12px rgba(255,170,70,.9);opacity:0;transition:opacity .12s}
#acc.on{opacity:1}
</style>

<body>
<canvas id="gl"></canvas>
<div id="msg">触れて、はじめる</div>
<div id="acc"></div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uDpr;
uniform float uTime;
uniform vec2 uTilt;
uniform float uWake;
uniform vec4 uKey[12];  // x, y (device px, top-left origin), radius, press
uniform float uGlow[12];
uniform vec4 uRod;      // x, y0, y1, radius
uniform vec4 uSrc;      // x, y, amp
uniform sampler2D uEng;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
// studio lighting seen in the metal: a tall softbox, a thin rim strip, a bright ceiling
float env(vec3 r){
  float box  = exp(-pow((r.x - 0.36) / 0.2, 2.0)) * smoothstep(-0.8, 0.3, r.y);
  float fill = exp(-pow((r.x + 0.4) / 0.35, 2.0)) * 0.32;
  float rim  = exp(-pow((r.x + 0.78) / 0.08, 2.0)) * 0.7 * smoothstep(-0.9, 0.6, r.y);
  float ceil = smoothstep(0.2, 1.0, r.y) * 0.6;
  float base = 0.2 + 0.12 * smoothstep(-1.0, 1.0, r.y);
  return box * 1.5 + fill + rim + ceil + base;
}

void main(){
  float s = uDpr;
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 q = p / uRes;

  // body of the horn: a slightly conical tube, brushed along its length
  vec3 n = vec3((q.x - 0.5) * 1.15, (0.5 - q.y) * 0.14, 1.0);
  float br = noise(vec2(p.x / (1.1 * s), p.y / (110.0 * s))) * 0.65 + noise(vec2(p.x / (0.45 * s), p.y / (35.0 * s))) * 0.35;
  n.x += (br - 0.5) * 0.025;
  float ao = 1.0;
  float isPearl = 0.0;
  vec3 pn = vec3(0.0, 0.0, 1.0);
  float pearlD = 0.0;
  float pearlGlow = 0.0;
  float pearlSeed = 0.0;
  vec3 glow = vec3(0.0);

  // key rod with end posts
  float rx = uRod.x, rr = uRod.w;
  if (p.y > uRod.y - rr && p.y < uRod.z + rr) {
    float t = (p.x - rx) / rr;
    if (abs(t) < 1.0 && p.y > uRod.y && p.y < uRod.z) { n = vec3(t * 1.2, 0.0, sqrt(max(0.0, 1.0 - t * t))); }
    float dx = p.x - rx - rr;
    if (dx > 0.0 && p.y > uRod.y && p.y < uRod.z) ao *= 1.0 - 0.4 * exp(-pow(dx / (5.0 * s), 2.0));
  }
  for (int e = 0; e < 2; e++) {
    vec2 pc = vec2(rx, e == 0 ? uRod.y : uRod.z);
    vec2 d2 = p - pc; float d = length(d2); float pr = rr * 2.1;
    if (d < pr) { vec2 u = d2 / pr; n = normalize(vec3(u.x * 0.9, -u.y * 0.9, 1.0)); }
    else ao *= 1.0 - 0.35 * exp(-pow((d - pr) / (5.0 * s), 2.0));
  }

  for (int i = 0; i < 12; i++) {
    vec4 k = uKey[i];
    float r = k.z;
    vec2 d2 = p - k.xy; float d = length(d2);
    // arm from the rod to the key cup
    if (i < 10) {
      float ht = 2.0 * s;
      if (p.x > rx && p.x < k.x - r && abs(d2.y) < ht) { float t = d2.y / ht; n = vec3(0.0, -t * 1.1, sqrt(max(0.0, 1.0 - t * t))); }
      if (p.x > rx && p.x < k.x - r && d2.y > ht && d2.y < ht + 6.0 * s) ao *= 1.0 - 0.3 * (1.0 - (d2.y - ht) / (6.0 * s));
    }
    float rin = r * 1.0, rout = r * 1.33, rc = (rin + rout) * 0.5, w = (rout - rin) * 0.5;
    float t = (d - rc) / w;
    vec2 rad = d2 / max(d, 0.001);
    if (abs(t) < 1.0) {
      vec3 rn = vec3(rad.x * t * 0.95, -rad.y * t * 0.95, sqrt(max(0.0, 1.0 - t * t * 0.9)));
      float edge = 1.0 - smoothstep(1.0 - 1.4 * s / w, 1.0, abs(t));
      n = normalize(mix(n, rn, max(edge, step(t, 0.0))));
    }
    if (d > rout) ao *= 1.0 - 0.5 * exp(-pow((d - rout) / (7.0 * s), 2.0));
    if (d < rin + 1.0 * s) {
      float press = k.w;
      vec2 u = d2 / r;
      float dome = 0.6 * (1.0 - 0.55 * press);
      pn = vec3(u.x * dome, -u.y * dome, 1.0);
      isPearl = 1.0 - smoothstep(rin - 1.2 * s, rin, d);
      pearlD = d / r; pearlGlow = uGlow[i]; pearlSeed = float(i) * 3.7;
      ao *= 1.0 - (0.18 + 0.4 * press) * smoothstep(0.62, 1.0, d / rin) * isPearl;
    }
    if (d >= rin) glow += vec3(1.0, 0.6, 0.24) * uGlow[i] * exp(-max(d - rout, 0.0) / (46.0 * s)) * 0.9;
  }

  // the metal trembles while a note sounds
  if (uSrc.z > 0.001) {
    vec2 d2 = p - uSrc.xy; float d = length(d2);
    float wv = sin(d / (8.0 * s) - uTime * 15.0) * exp(-d / (240.0 * s)) * uSrc.z;
    n.xy += (d2 / max(d, 1.0)) * vec2(1.0, -1.0) * wv * 0.09 * (1.0 - isPearl);
    glow += vec3(1.0, 0.55, 0.2) * uSrc.z * exp(-d / (200.0 * s)) * 0.22;
  }

  n = normalize(n);
  vec3 r = reflect(vec3(0.0, 0.0, -1.0), n);
  r.xy += uTilt;
  float e = env(normalize(r));
  vec3 brass = vec3(0.80, 0.55, 0.22);
  vec3 col = brass * (0.12 + 0.88 * e) + vec3(1.0, 0.9, 0.7) * pow(max(e - 1.2, 0.0), 2.0) * 0.4;
  col *= 0.95 + 0.1 * br;
  if (isPearl > 0.0) {
    n = normalize(pn);
    r = reflect(vec3(0.0, 0.0, -1.0), n);
    r.xy += uTilt;
    e = env(normalize(r));
    vec3 pc;
    float nac = noise(p / (15.0 * s) + pearlSeed) * 0.75 + noise(p / (5.0 * s) - pearlSeed) * 0.25;
    float ph = dot(n.xy, uTilt * 2.2 + vec2(0.2, 0.3)) * 1.9 + nac * 0.9 + pearlD * 0.7;
    vec3 iri = 0.5 + 0.5 * cos(6.2832 * (ph + vec3(0.0, 0.33, 0.67)));
    vec3 base = mix(vec3(0.97, 0.95, 0.92), iri, 0.2);
    pc = base * (0.7 + 0.3 * n.z) * (1.05 + 0.18 * e) + vec3(1.0) * pow(clamp(e / 2.4, 0.0, 1.0), 4.0) * 0.35;
    pc = mix(pc, vec3(1.25, 0.95, 0.55), pearlGlow * 0.65) + vec3(1.0, 0.65, 0.3) * pearlGlow * 0.45;
    col = mix(col, pc, isPearl);
  }
  col *= ao;
  col += glow;

  vec4 eng = texture2D(uEng, q);
  col *= 1.0 - eng.r * 0.55;
  col += vec3(1.0, 0.85, 0.55) * eng.g * 0.12;

  float vg = smoothstep(1.25, 0.25, length((q - 0.5) * vec2(1.05, 0.85)));
  col *= (0.62 + 0.38 * vg) * uWake;
  col = 1.0 - exp(-col * 1.3);
  gl_FragColor = vec4(pow(col, vec3(0.95)), 1.0);
}
</script>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// C major, bottom key to top key (ド to the next octave's ミ), middle register
const NOTES = [60, 62, 64, 65, 67, 69, 71, 72, 74, 76];
const NAMES = ['ド', 'レ', 'ミ', 'ファ', 'ソ', 'ラ', 'シ', 'ド', 'レ', 'ミ'];
const NK = NOTES.length;

/* ================= sound ================= */
function makeSaxWave(ctx) {

  const a = [0, 1, .62, .75, .52, .48, .40, .33, .29, .24, .20, .17, .15, .13, .11, .095, .08, .07, .06, .05];
  for (let n = 1; n < N; n++) imag[n] = n < a.length ? a[n] : a[a.length - 1] * Math.pow(.86, n - a.length + 1);
  return ctx.createPeriodicWave(real, imag);
}
const SHAPE_K = 3, SHAPE_D = Math.tanh(SHAPE_K), ASYM = 0.08;
function makeCurve() {
  const n = 2048, c = new Float32Array(n), off = Math.tanh(SHAPE_K * ASYM);
  for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = (Math.tanh(SHAPE_K * (x + ASYM)) - off) / SHAPE_D; }

  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

  for (let ch = 0; ch < 2; ch++) {

    for (let i = 0; i < n; i++) {

      lp += ((Math.random() * 2 - 1) - lp) * k;

  constructor(ctx, out, noiseBuf) {

    const o = this.osc = ctx.createOscillator();
    o.setPeriodicWave(makeSaxWave(ctx)); o.frequency.value = 220;
    const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
    const F = (type, f, q, gain) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; if (gain != null) b.gain.value = gain; return b; };

    this.amp = G(0);

    const ns = ctx.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true;
    this.nbp = F('bandpass', 2000, .9); this.ng = G(.02); ns.connect(this.nbp).connect(this.ng).connect(this.amp);
    this.cbp = F('bandpass', 2600, .7); this.cg = G(0); ns.connect(this.cbp).connect(this.cg).connect(this.amp);
    this.vib = ctx.createOscillator(); this.vib.frequency.value = 5.3; this.vibDepth = G(0); this.vib.connect(this.vibDepth).connect(o.detune);
    this.gl = ctx.createOscillator(); this.gl.frequency.value = 31; this.glDepth = G(0); this.glPitch = G(0);
    this.gl.connect(this.glDepth).connect(this.growlAM.gain); this.gl.connect(this.glPitch).connect(o.detune);
    this.scoop = null;
    if (ctx.createConstantSource) { this.scoop = ctx.createConstantSource(); this.scoop.offset.value = 0; this.scoop.connect(o.detune); this.scoop.start(); }

  }
  level(b, midi) { return (0.05 + 0.40 * Math.pow(b, 1.6)) * (1 - 0.18 * clamp((midi - 62) / 24, 0, 1)) * (this.scale || 1); }
  applyBreath(b, midi, t, force) {
    if (!force && Math.abs(b - this.b) < 0.006) return;
    this.b = b;
    const f0 = mtof(midi);
    this.lp.frequency.setTargetAtTime(clamp(f0 * (2 + 13 * Math.pow(b, 1.5)) + 350, 400, 11000), t, 0.03);
    this.lp.Q.setTargetAtTime(0.7 + 1.3 * b, t, 0.05);
    const pre = 0.3 + 0.65 * b * b;
    this.pre.gain.setTargetAtTime(pre, t, 0.03);
    this.post.gain.setTargetAtTime(SHAPE_D / Math.tanh(SHAPE_K * pre), t, 0.03);
    this.ng.gain.setTargetAtTime(0.012 + 0.035 * (1 - b), t, 0.05);
    this.nbp.frequency.setTargetAtTime(clamp(f0 * 3.2, 900, 5000), t, 0.05);
    const g = clamp((b - 0.86) / 0.14, 0, 1);
    this.glDepth.gain.setTargetAtTime(0.6 * g, t, 0.05); this.glPitch.gain.setTargetAtTime(22 * g, t, 0.05);
    if (this.gate && t >= this.artUntil) this.amp.gain.setTargetAtTime(this.level(b, midi), t, 0.035);
  }
  chiff(t, a) { this.cg.gain.setTargetAtTime(a, t, 0.003); this.cg.gain.setTargetAtTime(0, t + 0.012, 0.03); }
  scoopFrom(t, cents, tc) { if (!this.scoop) return; const p = this.scoop.offset; p.cancelScheduledValues(t); p.setValueAtTime(cents, t); p.setTargetAtTime(0, t + 0.005, tc); }
  vibStart(t, b) { const p = this.vibDepth.gain; p.cancelScheduledValues(t); p.setTargetAtTime(0, t, 0.02); p.setTargetAtTime(13 + 9 * b, t + 0.32, 0.3); }
  update(s) {

    const L = this.level(s.breath, s.midi);
    if (rescale && this.gate && s.gate) this.amp.gain.setTargetAtTime(L, t, 0.03);
    if (s.gate && !this.gate) {

      this.chiff(t, 0.12); this.scoopFrom(t, -40, 0.025); this.vibStart(t, s.breath); this.applyBreath(s.breath, s.midi, t, true);
    } else if (s.gate && s.midi !== this.midi) {
      this.osc.frequency.setTargetAtTime(f, t, 0.022); this.vibStart(t, s.breath); this.applyBreath(s.breath, s.midi, t, true);
    } else if (!s.gate && this.gate) {
      this.gate = false; this.amp.gain.setTargetAtTime(0, t, 0.06);

    if (Math.abs(s.bend - this.bend) > 0.005) { this.osc.detune.setTargetAtTime(s.bend * 100, t, 0.025); this.bend = s.bend; }

}
const audio = {
  ready: false, voices: [],
  init() {
    if (this.ready) { this.wake(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = this.ctx = new AC({ latencyHint: 'interactive' });
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.knee.value = 8; comp.attack.value = .005; comp.release.value = .15;
    const master = ctx.createGain(); master.gain.value = .95; comp.connect(master).connect(ctx.destination);

    const wet = ctx.createGain(); wet.gain.value = .9; rev.connect(wet).connect(comp);

    this.an = ctx.createAnalyser(); this.an.fftSize = 512; bus.connect(this.an); this.buf = new Uint8Array(512);

  wake() { if (this.ready && this.ctx.state !== 'running') this.ctx.resume().catch(() => {}); },
  level() {
    if (!this.ready) return 0;

    let s = 0; for (let i = 0; i < this.buf.length; i++) { const v = (this.buf[i] - 128) / 128; s += v * v; }

const VOICES = 4;

/* ================= tilt ================= */
const T = { asked: false, listening: false, denied: false, seen: false, center: null, elevS: 0, rollS: 0 };

  const roll = Math.asin(clamp(sr, -1, 1)) / DEG;                                 // how high the right edge is raised
  if (!T.seen) { T.seen = true; T.elevS = elev; T.rollS = roll; if (T.center == null) T.center = elev; showHint(); }

  const attach = () => { if (!T.listening) { window.addEventListener('deviceorientation', onOrient); T.listening = true; } };
  if (typeof DOE.requestPermission === 'function') {
    T.asked = true;
    DOE.requestPermission().then(s => { if (s === 'granted') attach(); else { T.denied = true; showHint(); } }).catch(() => {});
  } else attach();

/* ================= playing ================= */
const P = new Map();            // touch id -> { key, voice, t }
let oct = 0, acc = 0, phraseStart = 0;
let cur = { gate: false, midi: 60, key: 0, keys: [], breath: 0.6 };
const keys = []; let rod = {}, spacing = 60, octSplit = 0;
const OCT_UP = NK, OCT_DOWN = NK + 1;

// twist clockwise for a sharp, counter-clockwise for a flat (snapped, with hysteresis)
function updateAcc() {
  if (!T.seen) { acc = 0; return; }

  else if (acc * r < 10) acc = (Math.abs(r) > 16) ? Math.sign(r) : 0;

function compute() {
  updateAcc();
  const all = [...P.values()];
  oct = (all.some(p => p.key === OCT_UP) ? 1 : 0) - (all.some(p => p.key === OCT_DOWN) ? 1 : 0);
  const notes = all.filter(p => p.key >= 0 && p.key < NK).sort((a, b) => a.t - b.t);
  const gate = notes.length > 0;
  if (gate && !cur.gate) phraseStart = performance.now();
  const breath = gate ? breathNow() : cur.breath;
  const scale = notes.length > 1 ? 1.1 / Math.sqrt(notes.length) : 1;
  const midiOf = k => NOTES[NK - 1 - k] + 12 * oct + acc;
  if (audio.ready) {
    for (let v = 0; v < VOICES; v++) {
      const p = notes.find(q => q.voice === v), sx = audio.voices[v];
      if (p) sx.update({ gate: true, midi: midiOf(p.key), breath, bend: 0, scale });
      else if (sx.gate) sx.update({ gate: false, midi: sx.midi, breath, bend: 0, scale });
    }
  }
  const newest = notes[notes.length - 1];
  cur = { gate, key: newest ? newest.key : cur.key, keys: notes.map(p => p.key), midi: newest ? midiOf(newest.key) : cur.midi, breath };
  showAcc();
}
function freeVoice() {
  const used = new Set([...P.values()].filter(p => p.voice != null).map(p => p.voice));
  for (let v = 0; v < VOICES; v++) if (!used.has(v)) return v;
  // all busy: take over the oldest finger's voice
  const oldest = [...P.values()].filter(p => p.voice != null).sort((a, b) => a.t - b.t)[0];
  const v = oldest.voice; oldest.voice = null; oldest.key = -1; return v;
}
function keyAt(x, y) {
  if (x < rod.x - 10) return y < octSplit ? OCT_UP : OCT_DOWN;   // left thumb: octave keys
  let best = -1, bd = 1e9;
  for (let i = 0; i < NK; i++) {
    const dy = Math.abs(y - keys[i].y);
    if (dy < spacing * 0.75 && dy < bd) { bd = dy; best = i; }
  }
  return best;
}
const accEl = document.getElementById('acc');
function showAcc() {
  const on = cur.gate && acc !== 0;
  accEl.classList.toggle('on', on);
  if (on) { const k = keys[cur.key]; accEl.textContent = acc > 0 ? '♯' : '♭'; accEl.style.left = (k.x - k.r * 1.33 - 30) + 'px'; accEl.style.top = k.y + 'px'; }
}
function haptic() { try { if (navigator.vibrate) navigator.vibrate(7); } catch (e) {} }

/* ================= layout ================= */
let W = 0, H = 0, dpr = 1;
function layout() {
  dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const s = spacing = Math.min(H * 0.8 / (NK - 1 + 0.45), 84), r = Math.min(s * 0.37, W * 0.1, 32), gap = s * 0.45, cx = W * 0.62;
  const span = (NK - 1) * s + gap, y0 = H * 0.5 - span / 2;
  keys.length = 0;
  for (let i = 0; i < NK; i++) keys.push({ x: cx, y: y0 + i * s + (i >= 5 ? gap : 0), r });
  rod = { x: cx - r * 2.2, y0: y0 - s * 0.4, y1: keys[NK - 1].y + s * 0.4, r: 3.6 };
  // octave keys under the left thumb
  const ox = Math.max(44, rod.x * 0.42), orr = clamp(W * 0.075, 22, 32), mid = H * 0.53, off = Math.max(orr * 2.1, H * 0.085);
  keys.push({ x: ox, y: mid - off, r: orr });
  keys.push({ x: ox, y: mid + off, r: orr });
  octSplit = mid;
  drawEngraving();
  if (gl) gl.viewport(0, 0, cv.width, cv.height);
}
function drawEngraving() {
  const c = engCanvas, w = c.width = Math.round(W * dpr), h = c.height = Math.round(H * dpr), x = c.getContext('2d');
  x.clearRect(0, 0, w, h); x.save(); x.scale(dpr, dpr);
  const ex = W * 0.06, ey = H - Math.max(70, H * 0.11);
  const fam = '"Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive';
  const jp = '"Zen Kaku Gothic New", system-ui, sans-serif';
  const groove = (fn) => { x.fillStyle = x.strokeStyle = 'rgb(0,255,0)'; x.save(); x.translate(0, 1.2); fn(); x.restore(); x.fillStyle = x.strokeStyle = 'rgb(255,0,0)'; fn(); };
  x.globalCompositeOperation = 'lighter';
  groove(() => {
    x.font = `${Math.round(Math.min(W * 0.13, 54))}px ${fam}`; x.textBaseline = 'alphabetic'; x.textAlign = 'left';
    x.fillText('Iki', ex, ey);
    x.lineWidth = 1.1; x.lineCap = 'round';
    x.beginPath(); x.moveTo(ex - 4, ey + 12);
    x.bezierCurveTo(ex + 30, ey + 2, ex + 60, ey + 24, ex + 96, ey + 10);
    x.bezierCurveTo(ex + 112, ey + 4, ex + 118, ey + 18, ex + 106, ey + 20);
    x.bezierCurveTo(ex + 98, ey + 21, ex + 98, ey + 12, ex + 104, ey + 12);
    x.stroke();
    x.font = `12px ${fam}`; x.fillText('tilt saxophone', ex + 4, ey + 34);
    x.textBaseline = 'middle';
    for (let i = 0; i < NK; i++) {
      const k = keys[i], nm = NAMES[NK - 1 - i], root = nm === 'ド';
      x.font = `${root ? 700 : 500} ${Math.round(clamp(k.r * 0.72, 11, 16))}px ${jp}`;
      x.fillText(nm, k.x + k.r * 1.33 + 10, k.y + 1);
    }
    const up = keys[OCT_UP], dn = keys[OCT_DOWN];
    x.textAlign = 'center'; x.font = `700 12px ${jp}`;
    x.fillText('オクターブ上', up.x, up.y - up.r * 1.33 - 16);
    x.fillText('オクターブ下', dn.x, dn.y + dn.r * 1.33 + 16);
  });
  x.restore();
  if (gl) { gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c); }
}

/* ================= GL ================= */
const cv = $('#gl'), engCanvas = document.createElement('canvas');
const gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
let prog, U = {}, tex;
if (!gl) { $('#msg').textContent = 'この端末ではWebGLが使えないため表示できません'; }
else {
  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }'));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, $('#fs').textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uRes', 'uDpr', 'uTime', 'uTilt', 'uWake', 'uKey', 'uGlow', 'uRod', 'uSrc', 'uEng']) U[n] = gl.getUniformLocation(prog, n);
  tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(U.uEng, 0);
}

const press = new Float32Array(12), glow = new Float32Array(12), keyBuf = new Float32Array(48);
const V = { tilt: [0, 0], wake: 0.38, wakeT: 0.38, level: 0, src: [0, 0, 0] };
let started = false;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!gl) return;
  const t = ts / 1000;
  if (cur.gate) { const b = breathNow(); if (Math.abs(b - cur.breath) > 0.006) compute(); }
  V.level += (audio.level() - V.level) * 0.25;
  V.wake += (V.wakeT - V.wake) * 0.035;
  let tx, ty;
  if (T.seen) { tx = clamp(-T.rollS / 40, -1, 1) * 0.55; ty = clamp((T.elevS - T.center) / 40, -1, 1) * 0.55; }
  else { tx = Math.sin(t * 0.31) * 0.16 + Math.sin(t * 0.13) * 0.08; ty = Math.cos(t * 0.23) * 0.12; }
  V.tilt[0] += (tx - V.tilt[0]) * 0.18; V.tilt[1] += (ty - V.tilt[1]) * 0.18;
  const held = new Set([...P.values()].map(p => p.key));
  const sounding = new Set(cur.keys);
  for (let i = 0; i < NK + 2; i++) {
    const pt = held.has(i) ? 1 : 0;
    press[i] += (pt - press[i]) * (pt ? 0.5 : 0.22);
    let gt = (i < NK && sounding.has(i)) ? clamp(0.45 + V.level * 3.2, 0, 1) : 0;
    if (i >= NK && held.has(i)) gt = 0.95;
    glow[i] += (gt - glow[i]) * (gt > glow[i] ? 0.35 : 0.08);
    const k = keys[i]; keyBuf.set([k.x * dpr, k.y * dpr, k.r * dpr, press[i]], i * 4);
  }
  const ak = keys[cur.key];
  V.src[0] = ak.x; V.src[1] = ak.y; V.src[2] += ((cur.gate ? clamp(V.level * 3.5, 0, 1) : 0) - V.src[2]) * 0.2;
  gl.uniform2f(U.uRes, cv.width, cv.height); gl.uniform1f(U.uDpr, dpr); gl.uniform1f(U.uTime, t);
  gl.uniform2f(U.uTilt, V.tilt[0], V.tilt[1]); gl.uniform1f(U.uWake, V.wake);
  gl.uniform4fv(U.uKey, keyBuf); gl.uniform1fv(U.uGlow, glow);
  gl.uniform4f(U.uRod, rod.x * dpr, rod.y0 * dpr, rod.y1 * dpr, rod.r * dpr);
  gl.uniform4f(U.uSrc, V.src[0] * dpr, V.src[1] * dpr, V.src[2], 0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ================= input ================= */
let hintTimer = 0;
function showHint() {
  const m = $('#msg');
  let sub = '持ち上げると強く、ひねると半音上下';
  if (!T.seen) sub = T.denied ? '傾きセンサーが許可されていません' : '';
  m.innerHTML = '右手で真珠、左手の親指でオクターブ' + (sub ? `<small>${sub}</small>` : '');
  m.classList.remove('off');
  clearTimeout(hintTimer); hintTimer = setTimeout(() => m.classList.add('off'), 5600);
}
// runs on the end of a tap: the only moment iOS lets a page unlock sound and ask for the motion sensor
function activate() {
  audio.init(); audio.wake();
  requestGyro();
  if (started) return;
  started = true;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  V.wakeT = 1;
  $('#msg').classList.add('off');
  setTimeout(showHint, 1300);
}
function down(id, x, y) {
  if (!started) return;
  audio.wake();
  const k = keyAt(x, y);
  const p = { key: k, voice: null, t: performance.now() };
  if (k >= 0 && k < NK) p.voice = freeVoice();
  P.set(id, p);
  if (k >= 0) haptic();
  compute();
}
function move(id, x, y) {
  const p = P.get(id); if (!p || p.key < 0 || p.key >= NK) return;
  const k = keyAt(x, y);
  if (k >= 0 && k < NK && k !== p.key) { p.key = k; p.t = performance.now(); compute(); }
}
function up(id) { if (P.delete(id)) compute(); }

if ('ontouchstart' in window) {
  const each = (e, fn) => { for (const t of e.changedTouches) fn(t); };
  cv.addEventListener('touchstart', e => { e.preventDefault(); each(e, t => down(t.identifier, t.clientX, t.clientY)); }, { passive: false });
  cv.addEventListener('touchmove', e => { e.preventDefault(); each(e, t => move(t.identifier, t.clientX, t.clientY)); }, { passive: false });
  cv.addEventListener('touchend', e => { e.preventDefault(); each(e, t => up(t.identifier)); activate(); }, { passive: false });
  cv.addEventListener('touchcancel', e => { each(e, t => up(t.identifier)); }, { passive: false });
} else {
  cv.addEventListener('pointerdown', e => { activate(); try { cv.setPointerCapture(e.pointerId); } catch (err) {} down('p' + e.pointerId, e.clientX, e.clientY); });
  cv.addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
  cv.addEventListener('pointerup', e => up('p' + e.pointerId));
  cv.addEventListener('pointercancel', e => up('p' + e.pointerId));
}
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { P.clear(); compute(); }
  else if (started) { audio.wake(); if (T.seen) T.center = T.elevS; try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} }
});
// keyboard for desk testing: 1-0 play ド..ミ, hold ↑/↓ for the octave keys
window.addEventListener('keydown', e => {
  if (!started || e.repeat) return;
  const i = '1234567890'.indexOf(e.key);
  if (i >= 0) { P.set('k' + i, { key: NK - 1 - i, voice: freeVoice(), t: performance.now() }); compute(); }
  if (e.key === 'ArrowUp') { P.set('ou', { key: OCT_UP, voice: null, t: performance.now() }); compute(); }
  if (e.key === 'ArrowDown') { P.set('od', { key: OCT_DOWN, voice: null, t: performance.now() }); compute(); }
});
window.addEventListener('keyup', e => {
  const i = '1234567890'.indexOf(e.key);
  if (i >= 0) up('k' + i);
  if (e.key === 'ArrowUp') up('ou');
  if (e.key === 'ArrowDown') up('od');
});

window.addEventListener('resize', layout);
if (screen.orientation) screen.orientation.addEventListener('change', () => setTimeout(layout, 120));
if (document.fonts) Promise.all([document.fonts.load('54px "Pinyon Script"'), document.fonts.load('700 14px "Zen Kaku Gothic New"')]).then(drawEngraving).catch(() => {});
layout();
requestAnimationFrame(frame);
window.__iki = { T, P, keys, audio, compute, activate, get cur() { return cur; }, get oct() { return oct; }, get acc() { return acc; } };
})();
</script>
</body>
