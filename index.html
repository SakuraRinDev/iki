<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>IKI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
html,body{margin:0;height:100%;background:#0b0c10;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.over{position:fixed;left:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;color:#fff;transition:opacity .9s ease}
#intro{top:50%;padding:22px 30px;border-radius:22px;background:rgba(8,9,14,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#intro b{display:block;font-weight:900;font-size:44px;letter-spacing:.18em;margin-left:.18em;line-height:1.1}
#intro span{display:block;font-weight:700;font-size:14px;letter-spacing:.2em;margin-top:10px;opacity:.85}
#hint{top:50%;padding:16px 22px;border-radius:18px;background:rgba(8,9,14,.66);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  font-weight:700;font-size:15px;line-height:1.75;letter-spacing:.06em;white-space:nowrap;opacity:0}
#hint small{display:block;font-weight:500;font-size:12.5px;opacity:.75;letter-spacing:.04em}
#acc{top:calc(env(safe-area-inset-top,0px) + 40px);font-weight:900;font-size:40px;opacity:0;transition:opacity .12s;
  text-shadow:0 0 18px rgba(255,255,255,.8)}
.off{opacity:0!important}
.show{opacity:1!important}
</style>

<canvas id="gl"></canvas>
<div id="intro" class="over"><b>IKI</b><span>触れて、はじめる</span></div>
<div id="hint" class="over"></div>
<div id="acc" class="over"></div>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uDpr;
uniform float uTime;
uniform float uWake;
uniform vec2 uTilt;
uniform vec4 uArea;       // x0, y0, w, h in device px (top-left origin)
uniform vec2 uGrid;       // cols, rows
uniform float uGap;
uniform sampler2D uPads;  // one texel per pad: rgb = colour, a = light
uniform sampler2D uText;  // note names
uniform vec4 uRip[12];    // x, y, age (s), strength
uniform vec3 uRipC[12];

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float sdBox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }

void main(){
  float s = uDpr;
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 q = p / uRes;
  vec2 cell = uArea.zw / uGrid;
  vec2 g = (p - uArea.xy) / cell;
  vec2 ci = floor(g);
  float rad = min(cell.x, cell.y) * 0.2;

  // graphite body
  vec3 col = vec3(0.028, 0.03, 0.04) + (hash(floor(p / s)) - 0.5) * 0.012;
  vec3 halo = vec3(0.0);
  float inside = 0.0;
  vec3 padCol = vec3(0.0);
  float padLight = 0.0;
  float sdOwn = 1e5;
  vec2 uvOwn = vec2(0.0);

  for (int dj = -1; dj <= 1; dj++) {
    for (int di = -1; di <= 1; di++) {
      vec2 c = ci + vec2(float(di), float(dj));
      if (c.x < 0.0 || c.y < 0.0 || c.x >= uGrid.x || c.y >= uGrid.y) continue;
      vec4 pd = texture2D(uPads, (c + 0.5) / uGrid);
      vec2 cc = uArea.xy + (c + 0.5) * cell;
      vec2 hb = cell * 0.5 - uGap * 0.5;
      float sd = sdBox(p - cc, hb, rad);
      halo += pd.rgb * pd.a * exp(-max(sd, 0.0) / (cell.x * 0.16)) * 0.55;
      if (di == 0 && dj == 0) { sdOwn = sd; padCol = pd.rgb; padLight = pd.a; uvOwn = (p - cc) / hb; }
    }
  }

  inside = 1.0 - smoothstep(-1.0 * s, 1.0 * s, sdOwn);
  if (inside > 0.0) {
    // frosted pad: tinted when idle, lit from within when played
    vec3 idle = mix(vec3(0.07, 0.075, 0.095), padCol * 0.17, 0.75);
    float core = exp(-dot(uvOwn, uvOwn) * 1.1);
    vec3 lit = padCol * (0.75 + 0.95 * core) + vec3(1.0) * pow(core, 2.0) * 0.55;
    vec3 pc = mix(idle, lit, padLight);
    // soft gloss that slides with the tilt of the phone
    vec2 gp = uvOwn - vec2(-0.35, -0.55) + uTilt * 0.9;
    pc += vec3(1.0) * exp(-dot(gp, gp) * 2.2) * 0.07;
    // bright inner rim
    pc += padCol * smoothstep(-3.0 * s, 0.0, sdOwn) * (0.18 + 0.5 * padLight);
    col = mix(col, pc, inside);
  }
  col += halo * (1.0 - inside * 0.6);

  // light waves running across the surface
  for (int k = 0; k < 12; k++) {
    vec4 r = uRip[k];
    if (r.w <= 0.0) continue;
    float d = length(p - r.xy);
    float front = r.z * cell.x * 8.5;
    float ring = exp(-pow((d - front) / (cell.x * 0.42), 2.0)) * exp(-r.z * 2.3) * r.w;
    col += uRipC[k] * ring * (0.18 + 0.7 * inside);
  }

  // note names
  float t = texture2D(uText, q).r;
  col = mix(col, mix(padCol * 0.95 + 0.08, vec3(1.0), padLight), t * (0.6 + 0.4 * padLight));

  float vg = smoothstep(1.3, 0.35, length((q - 0.5) * vec2(1.0, 0.8)));
  col *= (0.75 + 0.25 * vg) * uWake;
  col = 1.0 - exp(-col * 1.6);
  gl_FragColor = vec4(col, 1.0);
}
</script>

  cell.w = area.w / COLS;
  ROWS = clamp(Math.round(area.h / (cell.w * 1.12)), landscape ? 4 : 6, 9);
  cell.h = area.h / ROWS;
  gap = Math.max(6, cell.w * 0.09);
  const n = COLS * ROWS;
  light = new Float32Array(n); padData = new Uint8Array(n * 4);
  if (gl) {
    gl.bindTexture(gl.TEXTURE_2D, padTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, COLS, ROWS, 0, gl.RGBA, gl.UNSIGNED_BYTE, padData);
    gl.viewport(0, 0, cv.width, cv.height);
  }
  drawText();
}
function drawText() {
  const c = textCanvas; c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  const x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height); x.save(); x.scale(dpr, dpr);
  x.fillStyle = '#fff'; x.textBaseline = 'alphabetic'; x.textAlign = 'left';
  const fs = Math.round(clamp(cell.w * 0.2, 11, 16));
  for (let pad = 0; pad < COLS * ROWS; pad++) {
    const d = degOf(pad), r = Math.floor(pad / COLS), col = pad % COLS;
    const px = area.x + col * cell.w + gap * 0.5, py = area.y + r * cell.h + gap * 0.5;
    const root = d % 7 === 0;
    x.font = `${root ? 900 : 700} ${root ? fs + 2 : fs}px "Zen Kaku Gothic New", system-ui, sans-serif`;
    x.fillText(NAMES[d % 7], px + cell.w * 0.12, py + cell.h - gap - cell.h * 0.12);
  }
  x.restore();
  if (gl) { gl.bindTexture(gl.TEXTURE_2D, textTex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c); }
}

/* ================= GL ================= */
const cv = $('#gl'), textCanvas = document.createElement('canvas');
const gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
let U = {}, padTex, textTex;
function mkTex(filter) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
if (!gl) { $('#intro').innerHTML = '<span>この端末ではWebGLが使えないため表示できません</span>'; }
else {
  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }'));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, $('#fs').textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uRes', 'uDpr', 'uTime', 'uWake', 'uTilt', 'uArea', 'uGrid', 'uGap', 'uPads', 'uText', 'uRip', 'uRipC']) U[n] = gl.getUniformLocation(prog, n);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  padTex = mkTex(gl.NEAREST); textTex = mkTex(gl.LINEAR);
  gl.uniform1i(U.uPads, 0); gl.uniform1i(U.uText, 1);
}

const ripBuf = new Float32Array(RIP * 4), ripCBuf = new Float32Array(RIP * 3);
const V = { tilt: [0, 0], wake: 0.45, wakeT: 0.45 };
function frame(ts) {
  requestAnimationFrame(frame);
  if (!gl) return;
  const t = ts / 1000, now = performance.now() / 1000;
  if (cur.gate) { const b = breathNow(); if (Math.abs(b - cur.breath) > 0.006) compute(); }
  V.wake += (V.wakeT - V.wake) * 0.04;
  let tx, ty;
  if (T.seen) { tx = clamp(-T.rollS / 40, -1, 1) * 0.5; ty = clamp((T.elevS - T.center) / 40, -1, 1) * 0.5; }
  else { tx = Math.sin(t * 0.31) * 0.12; ty = Math.cos(t * 0.23) * 0.1; }
  V.tilt[0] += (tx - V.tilt[0]) * 0.18; V.tilt[1] += (ty - V.tilt[1]) * 0.18;
  // pad lights: held pads full, every other pad with the same note name glows softly
  const n = COLS * ROWS, held = new Set(cur.pads), heldDeg = new Set(cur.pads.map(p => degOf(p) % 7));
  const boost = 0.75 + 0.25 * cur.breath;
  for (let i = 0; i < n; i++) {
    const dg = degOf(i) % 7;
    const tgt = held.has(i) ? boost : heldDeg.has(dg) ? 0.2 : 0;
    light[i] += (tgt - light[i]) * (tgt > light[i] ? 0.55 : 0.12);
    const c = COLORS[dg];
    padData.set([c[0], c[1], c[2], Math.round(clamp(light[i], 0, 1) * 255)], i * 4);
  }
  for (let k = 0; k < RIP; k++) {
    const r = rips[k], age = now - r.t0;
    ripBuf.set([r.x * dpr, r.y * dpr, age, age < 2.5 ? r.s : 0], k * 4);
    ripCBuf.set(r.c, k * 3);
  }
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, padTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, COLS, ROWS, gl.RGBA, gl.UNSIGNED_BYTE, padData);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, textTex);
  gl.uniform2f(U.uRes, cv.width, cv.height); gl.uniform1f(U.uDpr, dpr); gl.uniform1f(U.uTime, t); gl.uniform1f(U.uWake, V.wake);
  gl.uniform2f(U.uTilt, V.tilt[0], V.tilt[1]);
  gl.uniform4f(U.uArea, area.x * dpr, area.y * dpr, area.w * dpr, area.h * dpr);
  gl.uniform2f(U.uGrid, COLS, ROWS); gl.uniform1f(U.uGap, gap * dpr);
  gl.uniform4fv(U.uRip, ripBuf); gl.uniform3fv(U.uRipC, ripCBuf);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ================= input ================= */
let started = false, hintTimer = 0;
function showHint() {
  const h = $('#hint');
  h.innerHTML = '押したところが鳴る。何本でも同時に<small>縦に3つ並べて押すと和音' + (T.seen ? '<br>持ち上げると強く、ひねると半音上下' : '') + '</small>';
  h.classList.add('show');
  clearTimeout(hintTimer); hintTimer = setTimeout(() => h.classList.remove('show'), 4200);
}
// runs at the end of a tap: the only moment iOS lets a page unlock sound and ask for the motion sensor
function activate() {
  audio.init(); audio.wake();
  requestGyro();
  if (started) return;
  started = true;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
  V.wakeT = 1;
  $('#intro').classList.add('off');
  setTimeout(showHint, 900);
}
function down(id, x, y) {
  if (!started) return;
  audio.wake();
  const pad = padAt(x, y);
  if (pad < 0) return;
  $('#hint').classList.remove('show');
  P.set(id, { pad, voice: freeVoice(), t: performance.now() });
  ripple(pad);
  try { if (navigator.vibrate) navigator.vibrate(6); } catch (e) {}
  compute();
}
function move(id, x, y) {
  const p = P.get(id); if (!p) return;
  const pad = padAt(x, y);
  if (pad >= 0 && pad !== p.pad) { p.pad = pad; ripple(pad); compute(); }
}
function up(id) { if (P.delete(id)) compute(); }

if ('ontouchstart' in window) {
  const each = (e, fn) => { for (const t of e.changedTouches) fn(t); };
  cv.addEventListener('touchstart', e => { e.preventDefault(); each(e, t => down(t.identifier, t.clientX, t.clientY)); }, { passive: false });
  cv.addEventListener('touchmove', e => { e.preventDefault(); each(e, t => move(t.identifier, t.clientX, t.clientY)); }, { passive: false });
  cv.addEventListener('touchend', e => { e.preventDefault(); each(e, t => up(t.identifier)); activate(); }, { passive: false });
  cv.addEventListener('touchcancel', e => { each(e, t => up(t.identifier)); }, { passive: false });
} else {
  cv.addEventListener('pointerdown', e => { activate(); try { cv.setPointerCapture(e.pointerId); } catch (err) {} down('p' + e.pointerId, e.clientX, e.clientY); });
  cv.addEventListener('pointermove', e => move('p' + e.pointerId, e.clientX, e.clientY));
  cv.addEventListener('pointerup', e => up('p' + e.pointerId));
  cv.addEventListener('pointercancel', e => up('p' + e.pointerId));
}
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { P.clear(); compute(); }
  else if (started) { audio.wake(); if (T.seen) T.center = T.elevS; try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} }
});

window.addEventListener('resize', () => { P.clear(); compute(); layout(); });
if (document.fonts) document.fonts.load('900 14px "Zen Kaku Gothic New"').then(drawText).catch(() => {});
layout();
requestAnimationFrame(frame);
window.__iki = { T, P, audio, area, cell, get cur() { return cur; }, get acc() { return acc; }, get grid() { return [COLS, ROWS]; }, degOf, midiOfDeg };
})();
</script>
